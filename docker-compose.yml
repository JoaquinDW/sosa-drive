# Stack self-hosted de Sosa Drive: PostgreSQL + Redis.
# Levantalo con `npm run db:up` y sembralo con `npm run db:seed`.
services:
  postgres:
    image: postgres:17
    container_name: sosa-postgres
    environment:
      POSTGRES_USER: sosa
      POSTGRES_PASSWORD: sosa
      POSTGRES_DB: sosa_drive
    ports:
      - "5432:5432"
    volumes:
      - sosa-postgres-data:/var/lib/postgresql/data
      # Las migraciones corren en orden alfabético al primer init (base vacía).
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sosa -d sosa_drive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sosa-redis
    ports:
      # 6380 en el host: 127.0.0.1:6379 suele estar ocupado por un Redis local
      # (Homebrew) y la app terminaría hablándole a ese en vez de a este.
      - "6380:6379"
    volumes:
      - sosa-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bot de WhatsApp (Baileys + OpenAI). Levantalo con `docker compose up -d bot`.
  # No expone puertos: el panel es la sección /whatsapp de la app Next.
  bot:
    build: ./bot
    container_name: sosa-bot
    env_file: .env.local # OPENAI_API_KEY / OPENAI_MODEL
    environment:
      # Pisan a env_file: dentro del compose se resuelve por DNS interno.
      DATABASE_URL: postgres://sosa:sosa@postgres:5432/sosa_drive
      REDIS_URL: redis://redis:6379
    volumes:
      - ./bot:/app
      # Volumen anónimo: evita que el bind mount tape el node_modules de la imagen.
      - /app/node_modules
      # Sesión de Baileys persistente (no vuelve a pedir QR entre reinicios).
      - ./data/wa-auth:/app/auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Explorador web de la base (opcional): http://localhost:8080
  adminer:
    image: adminer:5
    container_name: sosa-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sosa-postgres-data:
  sosa-redis-data:
